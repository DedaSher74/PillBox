<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умная Таблеточница - Система Контроля</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --bg-color: #eef5f6;
            --card-bg: rgba(255, 255, 255, 0.96); 
            --text-color: #2c3e50;
            --primary-color: #009688;
            --primary-hover: #00796b;
            --success-color: #2e7d32; 
            --pending-color: #c62828;
            --border-color: rgba(0, 150, 136, 0.15);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* === ОКНО АВТОРИЗАЦИИ === */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 90%; max-width: 380px;
            text-align: center; position: relative; z-index: 1001;
        }
        .auth-card h1 { color: var(--primary-color); margin-bottom: 25px; font-size: 28px; }
        .auth-card input, .auth-card select {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border-radius: 12px; border: 1.5px solid var(--border-color);
            box-sizing: border-box; font-size: 16px; outline: none;
        }
        .auth-card input:focus { border-color: var(--primary-color); }

        /* === ФОНОВАЯ АНИМАЦИЯ (ТАБЛЕТКИ) === */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden; pointer-events: none;
        }
        .capsule {
            position: absolute; bottom: -70px; width: 14px; height: 32px; border-radius: 12px;
            background: linear-gradient(to bottom, var(--primary-color) 50%, #ffffff 50%);
            opacity: 0.6; animation: float infinite linear;
        }
        .tablet {
            position: absolute; bottom: -70px; border-radius: 50%; background: #ffffff;
            opacity: 0.6; border: 1px solid var(--border-color); animation: float infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* === ОСНОВНОЙ КОНТЕНТ === */
        #mainContent { display: none; width: 100%; max-width: 500px; padding: 20px; z-index: 2; box-sizing: border-box; }
        
        .card { 
            background: var(--card-bg); border-radius: 20px; padding: 24px; 
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 79, 70, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.8); position: relative;
        }
        .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #7f8c8d; margin-top: 0; }

        .weight-display { 
            font-size: 54px; font-weight: 800; text-align: center; margin: 20px 0;
            color: var(--text-color); font-feature-settings: "tnum";
        }

        .btn { 
            width: 100%; padding: 16px; background: var(--primary-color); color: white; 
            border: none; border-radius: 14px; font-size: 16px; font-weight: 600; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(0, 150, 136, 0.2);
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fbfb; padding: 14px; border-radius: 12px; margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .status-tag {
            font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 700;
        }
        .status-taken { background: rgba(46, 125, 50, 0.1); color: var(--success-color); }
        .status-pending { background: rgba(198, 40, 40, 0.1); color: var(--pending-color); }

        /* Ролевое скрытие */
        .admin-only { display: none; }

        #toast {
            visibility: hidden; min-width: 280px; background: #2c3e50; color: white;
            text-align: center; border-radius: 12px; padding: 16px; position: fixed;
            left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        .invite-box {
            background: #f0fdfa; border: 2px dashed var(--primary-color);
            padding: 15px; border-radius: 12px; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>

    <!-- АНИМАЦИЯ ФОНА -->
    <div class="bg-animation" id="bgAnim"></div>

    <!-- ОКНО ВХОДА -->
    <div id="authOverlay">
        <div class="auth-card">
            <h1>Вход в систему</h1>
            <input type="text" id="loginUser" placeholder="Логин (admin или имя)">
            <input type="password" id="passUser" placeholder="Пароль (1234 или 0000)">
            <select id="roleUser">
                <option value="relative">Я — Родственник (Полный доступ)</option>
                <option value="patient">Я — Пациент (Только просмотр)</option>
            </select>
            <button class="btn" onclick="handleLogin()">Войти в панель</button>
            <p style="font-size: 12px; color: #95a5a6; margin-top: 20px;">
                Для получения доступа обратитесь к администратору системы
            </p>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="mainContent">
        <header style="text-align: center; margin-bottom: 25px;">
            <h1 style="margin: 0; color: var(--primary-color);">PillBox Control</h1>
            <div style="margin-top: 10px;">
                <span id="roleBadge" style="background: white; padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                    Роль: <span id="roleName">--</span>
                </span>
                <button onclick="location.reload()" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size:13px; margin-left:10px;">Выйти</button>
            </div>
        </header>

        <!-- ВЕС -->
        <div class="card">
            <h2>Текущий вес лекарств</h2>
            <div class="weight-display" id="weight">0.00 г</div>
            <button class="btn admin-only" id="tareBtn" onclick="triggerTare()">Обнулить весы (Тара)</button>
        </div>

        <!-- БУДИЛЬНИКИ -->
        <div class="card">
            <h2>График приема</h2>
            <div id="alarmsList"></div>
            <div class="admin-only" style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="time" id="newAlarmTime" style="flex-grow: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                <button class="btn" style="width: auto; padding: 12px 20px;" onclick="addAlarm()">+</button>
            </div>
        </div>

        <!-- ПРИГЛАШЕНИЯ (ТОЛЬКО ДЛЯ РОДСТВЕННИКА) -->
        <div class="card admin-only">
            <h2>Выдать доступ (Приглашение)</h2>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="invitePhone" placeholder="+7 (___) ___-__-__" style="flex-grow: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                <button class="btn" style="width: auto; padding: 12px 20px;" onclick="generateInvite()">Создать</button>
            </div>
            <div id="inviteResult" class="invite-box">
                <p style="margin: 0 0 10px 0; font-weight: bold; color: var(--primary-color);">Данные для входа:</p>
                <code id="inviteText" style="display: block; background: white; padding: 10px; border-radius: 6px; font-size: 13px;"></code>
                <button class="btn" style="margin-top: 10px; padding: 8px; font-size: 12px;" onclick="copyInvite()">Копировать текст</button>
            </div>
        </div>

        <!-- СИСТЕМНЫЕ НАСТРОЙКИ (ТОЛЬКО ДЛЯ РОДСТВЕННИКА) -->
        <div class="card admin-only">
            <h2>Настройки устройства</h2>
            <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer;">
                <input type="checkbox" id="smsToggle" onchange="updateConfig()"> 
                <span>Разрешить СМС-оповещения</span>
            </label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="buzzerToggle" onchange="updateConfig()"> 
                <span>Звуковой сигнал (Зуммер)</span>
            </label>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // === КОНФИГУРАЦИЯ FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyACXylsaUdFHPQe8Ekju07o29_SU9w2Vsk",
            databaseURL: "https://pillbox-20842-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let userRole = 'patient';
        let alarmsData = [];

        // ГЕНЕРАЦИЯ ЛЕТАЮЩИХ ТАБЛЕТОК
        function createBg() {
            const container = document.getElementById('bgAnim');
            for (let i = 0; i < 15; i++) {
                const isCapsule = Math.random() > 0.5;
                const el = document.createElement('div');
                el.className = isCapsule ? 'capsule' : 'tablet';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 10 + 10) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                if (!isCapsule) {
                    const size = Math.random() * 15 + 15 + 'px';
                    el.style.width = size; el.style.height = size;
                }
                container.appendChild(el);
            }
        }
        createBg();

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg; t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        // ЛОГИКА ВХОДА
        function handleLogin() {
            const login = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('passUser').value.trim();
            const role = document.getElementById('roleUser').value;

            // Простая проверка (в реальном проекте заменить на Firebase Auth)
            if ((login === "admin" && pass === "1234") || (login.length > 2 && pass === "0000")) {
                userRole = role;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('roleName').innerText = role === 'relative' ? 'Родственник' : 'Пациент';
                
                if (role === 'relative') {
                    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                }
                
                showToast("Вход выполнен успешно!");
                startSync();
            } else {
                showToast("Ошибка: Неверный логин или пароль");
            }
        }

        // СИНХРОНИЗАЦИЯ ДАННЫХ
        function startSync() {
            database.ref('pillbox/status').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Обновление веса
                document.getElementById('weight').innerText = (data.weight || 0).toFixed(2) + ' г';
                
                // Обновление настроек (только если мы админ)
                if (userRole === 'relative') {
                    document.getElementById('smsToggle').checked = data.smsEnabled ?? true;
                    document.getElementById('buzzerToggle').checked = data.buzzAlarm ?? true;
                }

                // Обновление будильников
                alarmsData = data.alarms || [];
                renderAlarms();
            });
        }

        function renderAlarms() {
            const list = document.getElementById('alarmsList');
            list.innerHTML = '';
            
            if (alarmsData.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#999; font-size:14px;">Список пуст</p>';
                return;
            }

            alarmsData.forEach((alarm, index) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div>
                        <span style="font-weight:bold; font-size:16px;">${alarm.time}</span>
                        <span class="status-tag ${alarm.taken ? 'status-taken' : 'status-pending'}" style="margin-left:10px;">
                            ${alarm.taken ? 'Принято' : 'Ожидает'}
                        </span>
                    </div>
                    ${userRole === 'relative' ? `<button onclick="deleteAlarm(${index})" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size:20px;">&times;</button>` : ''}
                `;
                list.appendChild(item);
            });
        }

        // КОМАНДЫ УСТРОЙСТВУ
        function triggerTare() {
            database.ref('pillbox/commands').set({
                action: "tare",
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => showToast("Команда обнуления отправлена"));
        }

        function addAlarm() {
            const time = document.getElementById('newAlarmTime').value;
            if (!time) return;
            
            const newAlarms = [...alarmsData.map(a => a.time), time];
            database.ref('pillbox/commands').set({
                action: "save_alarms",
                list: newAlarms,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                showToast("Будильник добавлен");
                document.getElementById('newAlarmTime').value = '';
            });
        }

        function deleteAlarm(index) {
            const newAlarms = alarmsData.filter((_, i) => i !== index).map(a => a.time);
            database.ref('pillbox/commands').set({
                action: "save_alarms",
                list: newAlarms,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => showToast("Будильник удален"));
        }

        function updateConfig() {
            const sms = document.getElementById('smsToggle').checked;
            const buzz = document.getElementById('buzzerToggle').checked;
            
            database.ref('pillbox/commands').set({
                action: "save_config",
                smsEnabled: sms,
                buzzAlarm: buzz,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // СИСТЕМА ПРИГЛАШЕНИЙ
        function generateInvite() {
            const phone = document.getElementById('invitePhone').value.trim();
            if (phone.length < 10) { showToast("Введите номер телефона!"); return; }

            const login = "user_" + Math.floor(1000 + Math.random() * 9000);
            const pass = "0000";
            const text = `Доступ к PillBox для ${phone}:\nЛогин: ${login}\nПароль: ${pass}\nРоль: Пациент`;
            
            document.getElementById('inviteText').innerText = text;
            document.getElementById('inviteResult').style.display = 'block';
            showToast("Приглашение создано");
        }

        function copyInvite() {
            const text = document.getElementById('inviteText').innerText;
            navigator.clipboard.writeText(text).then(() => showToast("Скопировано в буфер обмена"));
        }
    </script>
</body>
</html>
